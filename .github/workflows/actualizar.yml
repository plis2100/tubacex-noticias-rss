name: Actualizar RSS de Tubacex

on:
  workflow_dispatch:

  schedule:
    # Cada hora. Python comprueba la hora exacta de España.
    - cron: "23 5-21 * * 1-6"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-tubacex
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear RSS
        run: python actualizar_rss.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar RSS de Tubacex"
            git push
          fi
